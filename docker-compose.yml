services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ZCOC_HTTP_PORT:-8080}:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USERNAME: ${MYSQL_USER:-z_coc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-z_coc_local_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-z_coc}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-z_coc}
      MYSQL_USER: ${MYSQL_USER:-z_coc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-z_coc_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - z_coc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  z_coc_mysql_data:
